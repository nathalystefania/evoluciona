<app-wrap-description [preTitle]="'DESCRIPTION.TEXT' | translate" [gridCols]="gridCols">
</app-wrap-description>

<div class="container-fluid page-info">
    <section class="container px-4 lg:px-6 max-w-[96rem] py-10 md:py-16">
        <p class="text-xl md:text-[1.35rem] leading-relaxed text-justify" [innerHTML]="'PAGE_INFO' | translate"></p>
    </section>

    <section class="container px-4 lg:px-6 max-w-[96rem] pb-16">
        <div class="flex flex-row flex-wrap justify-between mb-20" *ngFor="let section of sections; let i = index">
            <div class="flex flex-col w-full md:w-2/4 md:pr-5">
                <h4 [innerHTML]="section.title | translate"
                    class="flex text-gray text-2xl title_border_top relative pb-3 font-medium"></h4>
                <p class="text-xl md:text-[1.35rem] leading-relaxed text-justify" [innerHTML]="section.content | translate"></p>
            </div>
            <div class="flex flex-col w-full md:w-1/3 md:pl-5 self-center gap-4 mt-5 md:mt-0">
                <a 
                    *ngIf="section.button" 
                    [href]="section.document"
                    download
                    mat-raised-button color="primary"
                    class="w-full text-xl text-center p-4 font-medium transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-105 bg-primary hover:bg-orange text-white">
                    <mat-icon [svgIcon]="'icon-download'" class="mr-1 mat-icon--md align-middle"></mat-icon>
                    {{ section.button | translate }}
                </a>

                <div *ngIf="section.tel">
                    <a
                        [href]="'tel:' + (section.tel | removeSpaces)"
                        class="inline-flex w-auto text-xl text-primary hover:text-orange transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-105">
                        <mat-icon aria-hidden="true" aria-label="Teléfono de contacto" class="mr-2">call</mat-icon>
                        <span class=" no-underline underline-offset-4 hover:underline">{{ section.tel | translate }}</span>
                    </a>
                </div>

                <div *ngIf="section.email">
                    <a
                        [href]="'mailto:' + (section.email | removeSpaces)"
                        class="inline-flex w-auto text-xl text-primary hover:text-orange transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-105">
                        <mat-icon aria-hidden="true" aria-label="Email de contacto" class="mr-2">mail</mat-icon>
                        <span class=" no-underline underline-offset-4 hover:underline">{{ section.email | translate }}</span>
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
