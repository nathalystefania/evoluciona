<div class="grid grid-cols-1 md:grid-cols-3">
  <div>
    <ul class="navbar uppercase text-extra-light-gray text-center md:text-left">
      <li [routerLink]="item.router"
        routerLinkActive="router-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        *ngFor="let item of mainMenu.defaultOptions">
        <span *ngIf="!item.link" [innerHTML]="item.name | translate"></span>
        <div *ngIf="item.link">
          <a [href]="item.link" target="_blank">{{item.name | translate}}</a>
        </div>
      </li>
    </ul>
  </div>
  <div class="brand self-center place-content-center text-center">
    <img class="max-w-xs lg:max-w-[320px] block mx-auto" src="./assets/images/new_globaltech_logo_bn.svg" alt="logo evoluciona global">
  </div>
  <div class="self-center mt-8 md:mt-0 md:justify-self-end">
    <div>
      <p class="font-bold text-sm mb-5 text-center">
        {{'FOLLOW_US_ON_NETWORKS' | translate}}
      </p>
      <app-social-media></app-social-media>
    </div>
  </div>
</div>

<p class="text-center text-base mt-2">
  {{'ALL_RIGHTS_RESERVED' | translate}} <br> © 2026 EVOLUCIONA GLOBAL.
</p>
